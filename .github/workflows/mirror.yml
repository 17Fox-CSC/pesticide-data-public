name: Public mirror safety

on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify-mirror-release:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*.test.mjs

  observe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record the checked-out public pointer
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const index = JSON.parse(readFileSync('data/index.json'));
          assert.match(index.current, /^v\d{14}-[0-9a-f]{8}$/);
          console.log(JSON.stringify({ commit: process.env.GITHUB_SHA, current: index.current, mode: 'read-only' }));
          JS
